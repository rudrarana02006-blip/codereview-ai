version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve & 
       sleep 5 && 
       ollama pull llama3.2:3b && 
       wait"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_BASE=http://localhost:8000/api
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  ollama_data:
